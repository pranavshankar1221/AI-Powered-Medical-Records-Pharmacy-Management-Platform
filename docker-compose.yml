version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mediqr_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mediqr_root_2024
      MYSQL_DATABASE: mediqr_db
      MYSQL_USER: mediqr_user
      MYSQL_PASSWORD: mediqr_pass_2024
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediqr_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://mediqr_user:mediqr_pass_2024@mysql:3306/mediqr_db
      SECRET_KEY: mediqr-super-secret-jwt-key-2024-change-in-prod
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ENVIRONMENT: production
    volumes:
      - ./backend/data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mediqr_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.1
    container_name: mediqr_mlflow
    restart: unless-stopped
    ports:
      - "5001:5000"
    command: mlflow server --host 0.0.0.0 --port 5000 --default-artifact-root /mlruns
    volumes:
      - mlflow_data:/mlruns

  prometheus:
    image: prom/prometheus:latest
    container_name: mediqr_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  grafana:
    image: grafana/grafana:latest
    container_name: mediqr_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  mysql_data:
  mlflow_data:
  prometheus_data:
  grafana_data:
