stages:
  - name: prepare_data
    cmd: python backend/ml/generate_synthetic_data.py
    deps:
      - backend/ml/generate_synthetic_data.py
    outs:
      - backend/data/raw/sales_history.csv
      - backend/data/raw/inventory_snapshot.csv

  - name: train_models
    cmd: python backend/ml/train_pipeline.py
    deps:
      - backend/ml/train_pipeline.py
      - backend/ml/demand_model.py
      - backend/ml/expiry_model.py
      - backend/data/raw/sales_history.csv
      - backend/data/raw/inventory_snapshot.csv
    outs:
      - backend/data/models/demand_model.joblib
      - backend/data/models/expiry_model.joblib
    metrics:
      - backend/data/metrics/demand_metrics.json
      - backend/data/metrics/expiry_metrics.json
